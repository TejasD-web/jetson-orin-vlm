version: "3.9"

services:
  edge:
    build: edge/
    ports:
      - "8000:8000"
    environment:
      - EDGE_LLAMA_SERVER_URL=http://host.docker.internal:8080
      - EDGE_MODEL_NAME=qwen2.5-vl-3b
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
